
<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Venustas & Tímpano — banco de esculturas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --bg2: #111;
    --bg3: #1a1a1a;
    --border: #2a2a2a;
    --accent: #c8b89a;
    --accent2: #8a7a6a;
    --text: #e8e0d4;
    --text2: #888;
    --text3: #555;
  }

  :root[data-theme="light"] {
    --bg: #f4f1ea;
    --bg2: #ebe7dd;
    --bg3: #e2ddd0;
    --border: #d3ccbb;
    --accent: #8a7250;
    --accent2: #a89478;
    --text: #2a2419;
    --text2: #6b6355;
    --text3: #9a9284;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,10,10,0.96);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
  }
  .header-inner {
    max-width: 1500px; margin: 0 auto;
    display: flex; align-items: center; gap: 28px;
    height: 66px; flex-wrap: wrap;
  }
  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px; letter-spacing: 6px;
    color: var(--accent); flex-shrink: 0; line-height: 1;
  }
  .logo span {
    color: var(--text3); font-size: 9px;
    font-family: 'Space Mono', monospace;
    letter-spacing: 2px; display: block; margin-top: -2px;
  }
  .search-wrap { flex: 1; max-width: 520px; position: relative; min-width: 200px; }
  .search-wrap input {
    width: 100%; background: var(--bg3);
    border: 1px solid var(--border); color: var(--text);
    font-family: 'Space Mono', monospace; font-size: 12px;
    padding: 10px 44px 10px 16px; outline: none;
    transition: border-color 0.2s; letter-spacing: 1px;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--text3); }
  .search-btn {
    position: absolute; right: 0; top: 0; bottom: 0;
    background: var(--accent); border: none; color: var(--bg);
    padding: 0 16px; cursor: pointer; font-size: 14px;
    transition: background 0.2s;
  }
  .search-btn:hover { background: var(--text); }

  /* HERO */
  .hero {
    max-width: 1500px; margin: 0 auto;
    padding: 40px 24px 28px;
    border-bottom: 1px solid var(--border);
  }
  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(40px, 7vw, 80px);
    font-weight: 300; font-style: italic;
    line-height: 0.9; letter-spacing: -1px;
  }
  .hero-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
  .hero-tag {
    background: none; border: 1px solid var(--border);
    color: var(--text2); font-family: 'Space Mono', monospace;
    font-size: 10px; letter-spacing: 1px; padding: 5px 11px;
    cursor: pointer; transition: all 0.15s; text-transform: uppercase;
  }
  .hero-tag:hover { border-color: var(--accent); color: var(--accent); }
  .hero-tag.active { background: var(--accent); border-color: var(--accent); color: var(--bg); }

  /* MAIN */
  .main { max-width: 1500px; margin: 0 auto; padding: 28px 24px 64px; }
  .status-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px; font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--text3);
  }
  .status-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); margin-right: 8px; animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* GRID */
  .grid { columns: 5 200px; column-gap: 12px; }
  .card {
    break-inside: avoid; margin-bottom: 12px; position: relative;
    overflow: hidden; cursor: pointer; background: var(--bg3);
    border: 1px solid var(--border);
  }
  .card img { width: 100%; display: block; transition: transform 0.4s, filter 0.4s; }
  .card:hover img { transform: scale(1.04); }
  body.mono .card img,
  body.mono .modal-card img { filter: grayscale(100%) contrast(1.05); }
  .card-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.55) 40%, rgba(0,0,0,0.15) 65%, transparent 80%);
    opacity: 0; transition: opacity 0.3s;
    display: flex; flex-direction: column; justify-content: flex-end; padding: 14px;
    pointer-events: none;
  }
  .card-overlay > * { pointer-events: auto; }
  .ver-mais-btn {
    background: var(--accent); border: none; color: var(--bg);
    font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1px;
    padding: 9px 0; margin-bottom: 6px; cursor: pointer; width: 100%;
    text-transform: uppercase; transition: background 0.15s; border-radius: 2px;
  }
  .ver-mais-btn:hover { background: #fff; color: #000; }
  .card:hover .card-overlay { opacity: 1; }
  .card-title {
    font-family: 'Cormorant Garamond', serif; font-size: 14px;
    font-style: italic; line-height: 1.3; margin-bottom: 8px;
  }
  .card-badge {
    display: inline-block; align-self: flex-start;
    background: var(--accent); color: var(--bg);
    font-size: 9px; letter-spacing: 1px; padding: 4px 8px;
    text-transform: uppercase; font-weight: 700;
  }
  .card-badge.mono { background: rgba(255,255,255,0.15); color: var(--text); }

  /* LOADING */
  .loading { text-align: center; padding: 80px 24px; }
  .loading-ring {
    display: inline-block; width: 40px; height: 40px;
    border: 1px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading p { font-size: 10px; letter-spacing: 3px; color: var(--text3); text-transform: uppercase; }

  .empty { text-align: center; padding: 80px 24px; color: var(--text3); }
  .empty .big {
    font-family: 'Cormorant Garamond', serif; font-size: 48px;
    font-style: italic; margin-bottom: 12px; color: var(--border);
  }
  .empty p { font-size: 11px; letter-spacing: 2px; }

  /* MODAL */
  .modal-bg {
    position: fixed; inset: 0; background: var(--bg);
    z-index: 999; display: none; padding: 0; overflow-y: auto;
  }
  .modal-bg.open { display: block; }
  .modal {
    max-width: 1400px; margin: 0 auto; min-height: 100vh; padding: 24px;
  }
  .modal-header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg); backdrop-filter: blur(12px);
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 24px; padding: 20px 0; margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .modal-title-lg {
    font-family: 'Cormorant Garamond', serif; font-size: 32px;
    font-style: italic; font-weight: 300; line-height: 1.1; margin-bottom: 10px;
  }
  .modal-meta {
    font-size: 10px; color: var(--text3); letter-spacing: 1.5px;
    text-transform: uppercase; line-height: 2;
  }
  .modal-meta a { color: var(--accent2); text-decoration: none; }
  .modal-meta a:hover { color: var(--accent); }
  .modal-close {
    background: none; border: 1px solid var(--border); color: var(--text2);
    width: 40px; height: 40px; cursor: pointer; font-size: 18px;
    flex-shrink: 0; transition: all 0.2s;
  }
  .modal-close:hover { border-color: var(--accent); color: var(--accent); }

  .angle-count {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--accent); margin-bottom: 20px;
  }

  .modal-grid { columns: 3 300px; column-gap: 14px; }
  .modal-card {
    break-inside: avoid; margin-bottom: 14px; position: relative;
    background: var(--bg3); border: 1px solid var(--border); overflow: hidden;
  }
  .modal-card img { width: 100%; display: block; transition: filter 0.4s; }
  .modal-card-actions {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex; gap: 6px; padding: 12px;
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    opacity: 0; transition: opacity 0.3s;
  }
  .modal-card:hover .modal-card-actions { opacity: 1; }
  .dl-btn {
    background: var(--accent); border: none; color: var(--bg);
    font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 1px;
    padding: 7px 12px; cursor: pointer; text-transform: uppercase;
    text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
    transition: background 0.2s;
  }
  .dl-btn:hover { background: var(--text); }
  .dl-btn.sec { background: rgba(255,255,255,0.12); color: var(--text); }
  .dl-btn.sec:hover { background: rgba(255,255,255,0.25); }

  .toast {
    position: fixed; bottom: 24px; right: 24px; background: var(--accent);
    color: var(--bg); font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    padding: 12px 20px; z-index: 9999; transform: translateY(80px); opacity: 0;
    transition: all 0.3s;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  .load-more-wrap { text-align: center; margin-top: 44px; }
  .load-more {
    background: none; border: 1px solid var(--border); color: var(--text2);
    font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 3px;
    padding: 14px 40px; cursor: pointer; text-transform: uppercase; transition: all 0.2s;
  }
  .load-more:hover { border-color: var(--accent); color: var(--accent); }

  .info-bar {
    background: var(--bg2); border-bottom: 1px solid var(--border);
    padding: 9px 24px; font-size: 9px; letter-spacing: 2px;
    color: var(--text3); text-align: center; text-transform: uppercase;
  }
  .info-bar a { color: var(--accent2); text-decoration: none; }

  /* ── EASTER EGG (imagem surpresa) ── */
  #easterEgg {
    display: none;
    position: relative;
    break-inside: avoid;
    margin-bottom: 12px;
    cursor: pointer;
    overflow: hidden;
    border: 1px solid var(--accent);
  }
  #easterEgg.show { display: block; animation: eggIn 0.8s ease; }
  @keyframes eggIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
  #easterEgg img { width: 100%; display: block; }
  #easterEgg .egg-msg {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,10,10,0.82);
    color: var(--accent);
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 22px; text-align: center; padding: 20px;
    opacity: 0; transition: opacity 0.4s;
    pointer-events: none;
  }
  #easterEgg:hover .egg-msg { opacity: 1; }

  /* ── AVALIAÇÃO ── */
  .rate-row { display: flex; gap: 5px; margin-top: 8px; }
  .rate-btn {
    flex: 1; background: rgba(20,20,20,0.9); border: 1px solid rgba(255,255,255,0.35);
    color: #fff; font-family: 'Space Mono', monospace; font-size: 15px;
    padding: 8px 0; cursor: pointer; transition: all 0.15s; border-radius: 2px;
  }
  .rate-btn:hover { border-color: #fff; background: rgba(40,40,40,0.95); }
  .rate-btn.on-like    { background: #2e7d4f; border-color: #4bbd77; }
  .rate-btn.on-maybe   { background: #b8891f; border-color: #e0aa3c; }
  .rate-btn.on-nope    { background: #a13d3d; border-color: #cf5b5b; }

  /* selo de status no canto do card */
  .rate-flag {
    position: absolute; top: 8px; left: 8px; z-index: 3;
    font-size: 14px; width: 26px; height: 26px; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.65);
  }
  .rate-flag.show { display: flex; }
  .rate-flag.f-like  { background: #2e7d4f; }
  .rate-flag.f-maybe { background: #b8891f; }
  .rate-flag.f-nope  { background: #a13d3d; }

  /* abas */
  .tabs-bar {
    display: flex; gap: 0; margin-bottom: 24px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .view-tab {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--text3); font-family: 'Space Mono', monospace; font-size: 11px;
    letter-spacing: 2px; padding: 12px 18px; cursor: pointer; text-transform: uppercase;
    transition: all 0.2s; margin-bottom: -1px;
  }
  .view-tab:hover { color: var(--text2); }
  .view-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .view-tab .cnt {
    display: inline-block; margin-left: 6px; font-size: 9px;
    background: var(--bg3); color: var(--text2); padding: 1px 6px; border-radius: 8px;
  }
  .view-tab.active .cnt { background: var(--accent); color: var(--bg); }

  /* avaliação dentro do modal */
  .modal-rate {
    display: flex; gap: 8px; margin-bottom: 24px; align-items: center; flex-wrap: wrap;
  }
  .modal-rate-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); }
  .m-rate-btn {
    background: var(--bg3); border: 1px solid var(--border); color: var(--text);
    font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1px;
    padding: 9px 16px; cursor: pointer; transition: all 0.15s; text-transform: uppercase;
  }
  .m-rate-btn:hover { border-color: var(--accent); }
  .m-rate-btn.on-like  { background: #2e7d4f; border-color: #2e7d4f; color: #fff; }
  .m-rate-btn.on-maybe { background: #b8891f; border-color: #b8891f; color: #fff; }
  .m-rate-btn.on-nope  { background: #a13d3d; border-color: #a13d3d; color: #fff; }

  .theme-btn {
    background: none; border: 1px solid var(--border); color: var(--text2);
    font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 2px;
    padding: 8px 14px; cursor: pointer; text-transform: uppercase;
    transition: all 0.2s; flex-shrink: 0;
  }
  .theme-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>

<div class="info-bar">
  Acervo: <a href="https://www.metmuseum.org" target="_blank">The Met Museum</a> · Greek &amp; Roman Art · domínio público CC0 · uso livre pessoal e comercial
</div>

<header>
  <div class="header-inner">
    <div class="logo">VENUSTAS<span>&amp; tímpano · banco de esculturas</span></div>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="buscar: statue, bust, goddess, torso..." />
      <button class="search-btn" onclick="doSearch()">→</button>
    </div>
    <button class="theme-btn" id="monoBtn" onclick="toggleMono()">◐ p&amp;b</button>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☾ escuro</button>
  </div>
</header>

<div class="hero">
  <div class="hero-title">escultura em mármore</div>
  <div class="hero-tags" id="heroTags">
    <!-- categorias inseridas via JS a partir do acervo -->
  </div>
</div>

<div class="main">
  <div class="tabs-bar">
    <button class="view-tab active" data-view="all" onclick="setView('all', this)">acervo</button>
    <button class="view-tab" data-view="like" onclick="setView('like', this)">gostei <span class="cnt" id="cntLike">0</span></button>
    <button class="view-tab" data-view="maybe" onclick="setView('maybe', this)">talvez <span class="cnt" id="cntMaybe">0</span></button>
    <button class="view-tab" data-view="nope" onclick="setView('nope', this)">não gostei <span class="cnt" id="cntNope">0</span></button>
  </div>
  <div class="status-bar">
    <div><span class="status-dot"></span><span id="statusText">carregando acervo...</span></div>
    <div id="countText"></div>
  </div>
  <div id="grid" class="grid"></div>
  <div id="loading" class="loading"><div class="loading-ring"></div><p>buscando no met museum...</p></div>
  <div id="empty" class="empty" style="display:none">
    <div class="big">∅</div><p>nenhuma escultura encontrada</p>
  </div>
  <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
    <button class="load-more" onclick="loadMore()">carregar mais</button>
  </div>
</div>

<!-- MODAL: TODOS OS ÂNGULOS -->
<div class="modal-bg" id="modal">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title-lg" id="modalTitle"></div>
        <div class="modal-meta" id="modalMeta"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="angle-count" id="angleCount"></div>
    <div style="margin-bottom:16px">
      <button class="m-rate-btn" id="btnMaisFotos" onclick="buscarMaisFotos()">⇲ buscar mais fotos desta peça</button>
    </div>
    <div class="modal-rate">
      <span class="modal-rate-label">o que achou?</span>
      <button class="m-rate-btn" id="mLike"  onclick="rateFromModal('like')">♥ gostei</button>
      <button class="m-rate-btn" id="mMaybe" onclick="rateFromModal('maybe')">◐ talvez</button>
      <button class="m-rate-btn" id="mNope"  onclick="rateFromModal('nope')">✕ não gostei</button>
    </div>
    <div class="modal-grid" id="modalGrid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════════════
//  ANALYTICS — envia eventos pro Google Analytics
// ════════════════════════════════════════════════════
function track(evento, dados) {
  try {
    if (typeof gtag === 'function') gtag('event', evento, dados || {});
  } catch(e) {}
}

// ════════════════════════════════════════════════════
//  ACERVO — arquivo local (acervo.json), servido junto ao site
//  Nunca trava, nunca pausa. Curado só com esculturas clássicas.
// ════════════════════════════════════════════════════

// ════════════════════════════════════════════════════
//  MET MUSEUM API — usada só ao abrir uma peça (ângulos)
// ════════════════════════════════════════════════════
const MET = 'https://collectionapi.metmuseum.org/public/collection/v1';
const PER_PAGE = 25;

let shownCount = 0;    // quantos já foram renderizados
let currentQuery = 'sculpture';
let currentView = 'all';   // aba ativa: all | like | maybe | nope
let modalObj = null;       // objeto aberto no modal
let searchToken = 0;       // identifica a busca mais recente (anti-corrida)

// ════════════════════════════════════════════════════
//  AVALIAÇÕES — salvas no navegador (localStorage)
//  Estrutura: { "<id>": { estado:'like|maybe|nope', obj:{...} } }
// ════════════════════════════════════════════════════
const STORE_KEY = 'venustas_ratings';

function loadRatings() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch(e) { return {}; }
}
function saveRatings(r) {
  localStorage.setItem(STORE_KEY, JSON.stringify(r));
}
let ratings = loadRatings();

// guarda um resumo leve do objeto pra poder mostrar nas abas depois
function slimObj(obj) {
  return {
    objectID: obj.objectID,
    title: obj.title,
    artistDisplayName: obj.artistDisplayName,
    objectDate: obj.objectDate,
    medium: obj.medium,
    objectURL: obj.objectURL,
    primaryImage: obj.primaryImage,
    primaryImageSmall: obj.primaryImageSmall,
    additionalImages: obj.additionalImages || []
  };
}

function getState(id) {
  return ratings[id] ? ratings[id].estado : null;
}

// define/remove avaliação. Clicar no mesmo estado desmarca.
function setRating(obj, estado) {
  const id = obj.objectID;
  if (ratings[id] && ratings[id].estado === estado) {
    delete ratings[id];             // clicou de novo = tira
    track('avaliacao', { acao: 'removeu', estado: estado, id: id });
  } else {
    ratings[id] = { estado, obj: slimObj(obj) };
    track('avaliacao', { acao: 'marcou', estado: estado, id: id });
  }
  saveRatings(ratings);
  updateCounts();
  refreshCardFlag(id);
  if (modalObj && modalObj.objectID === id) syncModalButtons(id);
  // se estamos numa aba filtrada, re-renderiza pra sumir/aparecer
  if (currentView !== 'all') renderView(currentView);
}

function updateCounts() {
  let l = 0, m = 0, n = 0;
  Object.values(ratings).forEach(r => {
    if (r.estado === 'like') l++;
    else if (r.estado === 'maybe') m++;
    else if (r.estado === 'nope') n++;
  });
  document.getElementById('cntLike').textContent = l;
  document.getElementById('cntMaybe').textContent = m;
  document.getElementById('cntNope').textContent = n;
}

// ── BUSCA (filtra o acervo local — instantâneo) ────
let allResults = [];      // resultados da busca/filtro atual
let currentCategoria = null;  // categoria ativa (ou null = todas)

function doSearch(reset = true) {
  const q = (document.getElementById('searchInput').value.trim() || '').toLowerCase();
  currentQuery = q;
  const meuToken = ++searchToken;

  if (reset && currentView !== 'all') {
    currentView = 'all';
    document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
    document.querySelector('.view-tab[data-view="all"]').classList.add('active');
    document.getElementById('empty').querySelector('p').textContent = 'nenhuma escultura encontrada';
  }
  if (reset) {
    shownCount = 0;
    document.getElementById('grid').innerHTML = '';
    document.getElementById('loadMoreWrap').style.display = 'none';
    document.getElementById('empty').style.display = 'none';
  }

  // filtra o acervo em memória
  let filtrados = ACERVO.slice();

  // por categoria (se houver uma ativa)
  if (currentCategoria) {
    filtrados = filtrados.filter(r => r.categoria === currentCategoria);
  }

  // por texto (título ou tipo)
  if (q) {
    filtrados = filtrados.filter(r =>
      (r.titulo || '').toLowerCase().includes(q) ||
      (r.tipo || '').toLowerCase().includes(q) ||
      (r.categoria || '').toLowerCase().includes(q)
    );
  }

  allResults = filtrados.map(normalizar);

  const semFiltro = (!q && !currentCategoria);

  if (allResults.length === 0) {
    document.getElementById('empty').style.display = 'block';
    document.getElementById('empty').querySelector('p').textContent =
      semFiltro ? 'acervo vazio' : 'nada encontrado com esse filtro';
    document.getElementById('statusText').textContent =
      currentCategoria ? currentCategoria : (q ? `"${q}"` : 'acervo');
    document.getElementById('countText').textContent = '0 resultados';
    return;
  }

  document.getElementById('countText').textContent = `${allResults.length} esculturas`;
  renderPage(meuToken);
  document.getElementById('statusText').textContent =
    currentCategoria ? currentCategoria
    : (q ? `"${q}"` : 'acervo completo');
  if (q) track('busca', { termo: q, resultados: allResults.length });

  // ACERVO MISTO: se há busca por texto, também busca ao vivo no Met
  // e acrescenta o que não estiver já no acervo local
  if (q && q.length >= 2) {
    buscarNoMetAoVivo(q, meuToken);
  }
}

// busca ao vivo no Met e acrescenta resultados novos à galeria
async function buscarNoMetAoVivo(termo, meuToken) {
  const statusEl = document.getElementById('statusText');
  const textoOriginal = statusEl.textContent;
  statusEl.textContent = textoOriginal + ' + buscando no Met...';

  try {
    const url = `${MET}/search?hasImages=true&q=${encodeURIComponent(termo)}`;
    const res = await fetch(url);
    const data = await res.json();
    if (meuToken !== searchToken) return;  // busca mudou, aborta

    let ids = data.objectIDs || [];
    // ignora os que já estão nos resultados atuais
    const jaTem = new Set(allResults.map(r => r.objectID));
    ids = ids.filter(id => !jaTem.has(id)).slice(0, 30);  // limita a 30 novos

    if (ids.length === 0) {
      statusEl.textContent = textoOriginal;
      return;
    }

    // busca os detalhes de cada peça
    const objetos = await Promise.all(
      ids.map(id => fetch(`${MET}/objects/${id}`).then(r => r.json()).catch(() => null))
    );
    if (meuToken !== searchToken) return;

    const novos = objetos.filter(o => o && o.primaryImageSmall && !jaTem.has(o.objectID));
    // acrescenta aos resultados e renderiza
    const grid = document.getElementById('grid');
    novos.forEach(o => {
      const obj = {
        objectID: o.objectID,
        title: o.title,
        artistDisplayName: o.artistDisplayName,
        objectDate: o.objectDate,
        medium: o.medium,
        objectName: o.objectName,
        categoria: '',
        objectURL: o.objectURL,
        primaryImageSmall: o.primaryImageSmall,
        primaryImage: o.primaryImage,
        n_angulos_cache: 1 + (o.additionalImages ? o.additionalImages.length : 0),
        additionalImages: o.additionalImages || null
      };
      allResults.push(obj);
      grid.appendChild(buildCard(obj));
    });

    statusEl.textContent = `${textoOriginal.replace(' + buscando no Met...','')} · +${novos.length} do Met`;
    document.getElementById('countText').textContent = `${allResults.length} esculturas`;
  } catch(e) {
    statusEl.textContent = textoOriginal;
  }
}

// converte um registro do acervo no formato usado pelos cards/modal
function normalizar(r) {
  return {
    objectID: r.met_id,
    title: r.titulo,
    artistDisplayName: r.artista,
    objectDate: r.data_obj,
    medium: r.material,
    objectName: r.tipo,
    categoria: r.categoria,
    objectURL: r.object_url,
    primaryImageSmall: r.thumb,
    primaryImage: r.imagem_full,
    n_angulos_cache: r.n_angulos || 1,
    additionalImages: null
  };
}

// ── RENDERIZAR PÁGINA (do acervo, sem chamadas externas) ──
function renderPage(meuToken) {
  const slice = allResults.slice(shownCount, shownCount + PER_PAGE);
  shownCount += slice.length;

  if (meuToken !== undefined && meuToken !== searchToken) return;

  const grid = document.getElementById('grid');
  slice.forEach(obj => {
    if (!obj || !obj.primaryImageSmall) return;
    grid.appendChild(buildCard(obj));
  });

  document.getElementById('loadMoreWrap').style.display =
    shownCount < allResults.length ? 'block' : 'none';
}

// monta um card com botões de avaliação + selo de status
function buildCard(obj) {
  const nAngles = obj.additionalImages
    ? 1 + obj.additionalImages.length
    : (obj.n_angulos_cache || 1);
  const estado = getState(obj.objectID);
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = obj.objectID;

  const flagIcon = estado === 'like' ? '♥' : estado === 'maybe' ? '◐' : estado === 'nope' ? '✕' : '';
  const flagCls  = estado ? `f-${estado} show` : '';

  card.innerHTML = `
    <div class="rate-flag ${flagCls}" data-flag>${flagIcon}</div>
    <img src="${obj.primaryImageSmall}" alt="${esc(obj.title)}" loading="lazy"
         onerror="this.closest('.card').remove()">
    <div class="card-overlay">
      <div class="card-title">${esc(truncate(obj.title || 'Sem título', 55))}</div>
      <span class="card-badge ${nAngles > 1 ? '' : 'mono'}">
        ${nAngles > 1 ? '◈ ' + nAngles + ' ângulos' : '1 foto'}
      </span>
      <button class="ver-mais-btn" data-vermais>⇲ ver mais fotos</button>
      <div class="rate-row">
        <button class="rate-btn ${estado==='like'?'on-like':''}"   title="gostei"     data-r="like">♥</button>
        <button class="rate-btn ${estado==='maybe'?'on-maybe':''}" title="talvez"     data-r="maybe">◐</button>
        <button class="rate-btn ${estado==='nope'?'on-nope':''}"   title="não gostei" data-r="nope">✕</button>
      </div>
    </div>`;

  // botão "ver mais fotos" abre o modal
  card.querySelector('[data-vermais]').onclick = (e) => {
    e.stopPropagation();
    openModal(obj);
  };
  // clicar na imagem também abre (fallback)
  card.querySelector('img').onclick = () => openModal(obj);
  card.querySelector('.card-title').onclick = () => openModal(obj);

  // cliques nos botões de avaliação (sem abrir modal)
  card.querySelectorAll('.rate-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      setRating(obj, btn.dataset.r);
      // atualiza visual dos botões deste card
      const novoEstado = getState(obj.objectID);
      card.querySelectorAll('.rate-btn').forEach(b => {
        b.className = 'rate-btn' +
          (b.dataset.r === novoEstado ? ' on-' + novoEstado : '');
      });
    };
  });

  return card;
}

// atualiza o selo de um card específico na tela (quando muda pelo modal)
function refreshCardFlag(id) {
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (!card) return;
  const estado = getState(id);
  const flag = card.querySelector('[data-flag]');
  if (!flag) return;
  if (estado) {
    const icon = estado === 'like' ? '♥' : estado === 'maybe' ? '◐' : '✕';
    flag.textContent = icon;
    flag.className = `rate-flag f-${estado} show`;
  } else {
    flag.className = 'rate-flag';
  }
  card.querySelectorAll('.rate-btn').forEach(b => {
    b.className = 'rate-btn' + (b.dataset.r === estado ? ' on-' + estado : '');
  });
}

function loadMore() {
  renderPage(searchToken);
}

// ── CATEGORIAS (menu do hero) ──────────────────────
// monta os botões de categoria a partir do que existe no acervo
function montarCategorias() {
  const cont = document.getElementById('heroTags');
  cont.innerHTML = '';

  // conta quantas esculturas há em cada categoria
  const contagem = {};
  ACERVO.forEach(r => {
    const c = r.categoria || 'outras';
    contagem[c] = (contagem[c] || 0) + 1;
  });

  // botão "todas"
  const btnTodas = document.createElement('button');
  btnTodas.className = 'hero-tag active';
  btnTodas.textContent = `todas (${ACERVO.length})`;
  btnTodas.onclick = () => selecionarCategoria(null, btnTodas);
  cont.appendChild(btnTodas);

  // um botão por categoria (na ordem definida no acervo.json, se houver)
  const ordem = CATEGORIAS.length ? CATEGORIAS : Object.keys(contagem);
  ordem.forEach(cat => {
    if (!contagem[cat]) return; // pula categoria sem itens
    const b = document.createElement('button');
    b.className = 'hero-tag';
    b.textContent = `${cat} (${contagem[cat]})`;
    b.onclick = () => selecionarCategoria(cat, b);
    cont.appendChild(b);
  });
}

// filtra o acervo por categoria (ou null = todas)
function selecionarCategoria(cat, btn) {
  currentCategoria = cat;
  document.querySelectorAll('.hero-tag').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');
  // limpa a busca de texto ao trocar de categoria
  document.getElementById('searchInput').value = '';
  track('categoria_clicada', { categoria: cat || 'todas' });
  doSearch(true);
  // easter egg aparece nas categorias deusas e anjos
  avaliarEasterEgg(cat);
}

// ── ABAS: acervo / gostei / talvez / não gostei ────
function setView(view, btn) {
  currentView = view;
  document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');

  if (view === 'all') {
    // volta pra busca normal
    document.getElementById('loadMoreWrap').style.display =
      shownCount < allResults.length ? 'block' : 'none';
    document.getElementById('statusText').textContent =
      (currentQuery && currentQuery !== 'sculpture') ? `"${currentQuery}"` : 'acervo completo';
    document.getElementById('grid').innerHTML = '';
    // re-renderiza os resultados já buscados
    reRenderCurrentSearch();
  } else {
    renderView(view);
  }
}

// re-renderiza a busca atual (usado ao voltar pra aba acervo)
function reRenderCurrentSearch() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const jaVistos = allResults.slice(0, shownCount);
  jaVistos.forEach(obj => {
    if (obj && obj.primaryImageSmall) grid.appendChild(buildCard(obj));
  });
  document.getElementById('loadMoreWrap').style.display =
    shownCount < allResults.length ? 'block' : 'none';
}

// mostra os itens salvos de uma categoria
function renderView(estado) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  document.getElementById('loadMoreWrap').style.display = 'none';
  document.getElementById('loading').style.display = 'none';

  const itens = Object.values(ratings).filter(r => r.estado === estado);
  const nomes = { like: 'gostei', maybe: 'talvez', nope: 'não gostei' };
  document.getElementById('statusText').textContent = nomes[estado];
  document.getElementById('countText').textContent = `${itens.length} salvos`;

  if (itens.length === 0) {
    document.getElementById('empty').style.display = 'block';
    document.getElementById('empty').querySelector('p').textContent =
      `nada em "${nomes[estado]}" ainda`;
    return;
  }
  document.getElementById('empty').style.display = 'none';
  itens.forEach(r => grid.appendChild(buildCard(r.obj)));
}

// ── AVALIAR PELO MODAL ─────────────────────────────
function rateFromModal(estado) {
  if (!modalObj) return;
  setRating(modalObj, estado);
}

function syncModalButtons(id) {
  const estado = getState(id);
  ['like','maybe','nope'].forEach(e => {
    const btn = document.getElementById('m' + e.charAt(0).toUpperCase() + e.slice(1));
    if (btn) btn.className = 'm-rate-btn' + (estado === e ? ' on-' + e : '');
  });
}

// ── MODAL: TODOS OS ÂNGULOS ────────────────────────
function openModal(obj) {
  modalObj = obj;
  track('escultura_aberta', { id: obj.objectID, titulo: obj.title || '', categoria: obj.categoria || '' });

  document.getElementById('modalTitle').textContent = obj.title || 'Sem título';
  document.getElementById('modalMeta').innerHTML = `
    ${esc(obj.artistDisplayName || 'Artista desconhecido')} · ${esc(obj.objectDate || '')}<br>
    ${esc(obj.medium || '')}<br>
    <span style="color:var(--accent2)">CC0 · Domínio Público</span> ·
    <a href="${obj.objectURL}" target="_blank">ver no Met ↗</a> ·
    ID: ${obj.objectID}
  `;

  // abre já com a primeira imagem (instantâneo)
  const primeira = obj.primaryImage || obj.primaryImageSmall;
  renderModalImages([primeira], obj);
  document.getElementById('angleCount').textContent = 'procurando outros ângulos...';

  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  document.querySelector('.modal-bg').scrollTop = 0;
  syncModalButtons(obj.objectID);

  // a surpresa não existe no Met — mostra só a própria imagem, sem buscar ângulos
  if (obj._isEgg) {
    document.getElementById('angleCount').textContent = '1 imagem disponível';
    return;
  }

  // se já buscamos os ângulos antes nesta sessão, usa o que está em memória
  if (obj.additionalImages) {
    const todas = [obj.primaryImage || primeira, ...obj.additionalImages];
    renderModalImages(todas, obj);
    document.getElementById('angleCount').textContent =
      todas.length > 1 ? `${todas.length} ângulos disponíveis` : '1 imagem disponível';
    return;
  }

  // SEMPRE busca os ângulos no Met ao abrir (não confia no n_angulos salvo).
  // Assim, mesmo que o acervo diga "1 ângulo", se a peça tiver mais no Met,
  // eles aparecem. E se o dado salvo estiver errado, corrige na hora.
  document.getElementById('angleCount').textContent = 'procurando outros ângulos...';
  const idAberto = obj.objectID;
  fetch(`${MET}/objects/${obj.objectID}`)
    .then(r => r.json())
    .then(full => {
      obj.additionalImages = full.additionalImages || [];
      obj.primaryImage = full.primaryImage || primeira;
      if (modalObj && modalObj.objectID === idAberto) {
        const todas = [obj.primaryImage, ...obj.additionalImages].filter(Boolean);
        renderModalImages(todas, obj);
        document.getElementById('angleCount').textContent =
          todas.length > 1 ? `${todas.length} ângulos disponíveis` : '1 imagem disponível';
      }
    })
    .catch(() => {
      if (modalObj && modalObj.objectID === idAberto) {
        document.getElementById('angleCount').textContent = '1 imagem disponível';
      }
    });
}

// botão "buscar mais fotos desta peça" — reconsulta o Met e traz TODAS as imagens
function buscarMaisFotos() {
  if (!modalObj) return;
  const obj = modalObj;
  const btn = document.getElementById('btnMaisFotos');
  const idAberto = obj.objectID;

  // a surpresa não existe no Met
  if (obj._isEgg) {
    document.getElementById('angleCount').textContent = 'esta é uma peça especial — só 1 imagem';
    return;
  }

  track('buscar_mais_fotos', { id: obj.objectID, titulo: obj.title || '' });
  btn.textContent = '⇲ buscando...';
  btn.disabled = true;
  document.getElementById('angleCount').textContent = 'buscando todas as fotos no Met...';

  fetch(`${MET}/objects/${obj.objectID}`)
    .then(r => r.json())
    .then(full => {
      obj.additionalImages = full.additionalImages || [];
      obj.primaryImage = full.primaryImage || obj.primaryImage;
      if (modalObj && modalObj.objectID === idAberto) {
        const todas = [obj.primaryImage, ...obj.additionalImages].filter(Boolean);
        renderModalImages(todas, obj);
        document.getElementById('angleCount').textContent =
          todas.length > 1 ? `${todas.length} fotos disponíveis` : 'só 1 foto disponível para esta peça';
      }
    })
    .catch(() => {
      document.getElementById('angleCount').textContent = 'não foi possível buscar mais fotos';
    })
    .finally(() => {
      btn.textContent = '⇲ buscar mais fotos desta peça';
      btn.disabled = false;
    });
}

// desenha as imagens (ângulos) na grade do modal
function renderModalImages(imgs, obj) {
  const mg = document.getElementById('modalGrid');
  mg.innerHTML = '';
  imgs.forEach((url, i) => {
    if (!url) return;
    // versão leve pra EXIBIR (web-large ~200KB em vez de original ~20MB)
    const urlLeve = url.replace('/original/', '/web-large/');
    const c = document.createElement('div');
    c.className = 'modal-card';
    const filename = `met_${obj.objectID}_${i === 0 ? 'principal' : 'angulo' + i}`;
    c.innerHTML = `
      <img src="${urlLeve}" alt="ângulo ${i+1}" loading="lazy"
           onerror="this.onerror=null; this.src='${url}'">
      <div class="modal-card-actions">
        <button class="dl-btn" onclick="smartDownload('${url}', '${filename}')">↓ baixar</button>
        <button class="dl-btn sec" onclick="copyUrl('${url}')">copiar url</button>
      </div>`;
    mg.appendChild(c);
  });
}


function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

function setLoading(v) {
  document.getElementById('loading').style.display = v ? 'block' : 'none';
}
function truncate(s, n) { return s.length > n ? s.slice(0, n) + '...' : s; }
function esc(s) {
  return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function copyUrl(url) {
  navigator.clipboard.writeText(url).then(() => showToast('URL copiada'));
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

});

// ── DOWNLOAD INTELIGENTE ───────────────────────────
// Se modo P&B estiver ligado, gera a versão preto-e-branco de verdade
// via canvas. Se estiver colorido, baixa o original direto.
async function smartDownload(url, filename) {
  track('download', { modo: monoOn ? 'pb' : 'cor' });
  // Modo colorido: baixa o original direto
  if (!monoOn) {
    baixarDireto(url, filename + '.jpg');
    return;
  }

  // Modo P&B: reprocessa em canvas
  showToast('gerando versão p&b...');
  try {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = reject;
      img.src = url;
    });

    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    // aplica grayscale pixel a pixel (luminância ponderada)
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const px = data.data;
    for (let i = 0; i < px.length; i += 4) {
      const cinza = 0.299 * px[i] + 0.587 * px[i+1] + 0.114 * px[i+2];
      px[i] = px[i+1] = px[i+2] = cinza;
    }
    ctx.putImageData(data, 0, 0);

    canvas.toBlob(blob => {
      if (!blob) { fallbackColorido(url, filename); return; }
      const blobUrl = URL.createObjectURL(blob);
      baixarDireto(blobUrl, filename + '_pb.jpg');
      setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);
      showToast('salvo em p&b');
    }, 'image/jpeg', 0.95);

  } catch (e) {
    // servidor não liberou reprocessamento — oferece colorido
    fallbackColorido(url, filename);
  }
}

function fallbackColorido(url, filename) {
  showToast('p&b indisponível — baixando colorido');
  baixarDireto(url, filename + '.jpg');
}

function baixarDireto(url, nome) {
  const a = document.createElement('a');
  a.href = url;
  a.download = nome;
  a.target = '_blank';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// ── MODO P&B ───────────────────────────────────────
let monoOn = true; // começa em preto e branco

function toggleMono() {
  monoOn = !monoOn;
  const btn = document.getElementById('monoBtn');
  if (monoOn) {
    document.body.classList.add('mono');
    btn.textContent = '◐ p&b';
  } else {
    document.body.classList.remove('mono');
    btn.textContent = '◐ cor';
  }
  track('troca_cor', { modo: monoOn ? 'pb' : 'cor' });
}

// ── TEMA ───────────────────────────────────────────
function toggleTheme() {
  const root = document.documentElement;
  const isLight = root.getAttribute('data-theme') === 'light';
  const btn = document.getElementById('themeBtn');
  if (isLight) {
    root.removeAttribute('data-theme');
    btn.textContent = '☾ escuro';
  } else {
    root.setAttribute('data-theme', 'light');
    btn.textContent = '☀ claro';
  }
  track('troca_tema', { tema: isLight ? 'escuro' : 'claro' });
}

const EGG_MSG = 'Platōnikòs érōs éoiken, ei dè kairòn eîkhon';
let eggJaApareceu = false;

function avaliarEasterEgg(cat) {
  // aparece em deusas, anjos ou atletas, e só uma vez por sessão
  if ((cat === 'deusas' || cat === 'anjos' || cat === 'atletas') && !eggJaApareceu) {
    mostrarEasterEgg();
  }
}

// objeto que representa a surpresa como uma "peça" avaliável
const EGG_OBJ = {
  objectID: 'egg-surpresa',
  title: 'A Corredora (The Runner), 2024',
  artistDisplayName: 'surpresa',
  objectDate: '2024',
  medium: 'Mármore',
  objectName: 'Statue',
  categoria: 'atletas',
  objectURL: '',
  primaryImageSmall: EGG_IMG,
  primaryImage: EGG_IMG,
  n_angulos_cache: 1,
  additionalImages: [],
  _isEgg: true
};

function mostrarEasterEgg() {
  eggJaApareceu = true;
  const grid = document.getElementById('grid');
  if (!grid) return;

  // usa o mesmo card das outras peças (já traz botões de avaliação)
  const egg = buildCard(EGG_OBJ);
  egg.id = 'easterEgg';
  egg.classList.add('show');

  // adiciona a mensagem secreta por cima (mouseover)
  const msg = document.createElement('div');
  msg.className = 'egg-msg';
  msg.textContent = EGG_MSG;
  egg.appendChild(msg);

  // evento: leu a mensagem secreta (passou o mouse) — dispara só uma vez
  let mouseoverContado = false;
  egg.addEventListener('mouseenter', () => {
    if (!mouseoverContado) {
      mouseoverContado = true;
      track('surpresa_mouseover', { acao: 'leu_mensagem' });
    }
  });

  // substitui o clique dos botões de avaliação: avalia, taguea e SOME
  egg.querySelectorAll('.rate-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const tipo = btn.dataset.r; // like | maybe | nope
      track('surpresa_avaliacao', { avaliacao: tipo });
      setRating(EGG_OBJ, tipo);   // guarda no sistema normal (entra nas abas)
      // some com animação
      egg.style.transition = 'opacity 0.6s, transform 0.6s';
      egg.style.opacity = '0';
      egg.style.transform = 'scale(0.9)';
      setTimeout(() => egg.remove(), 600);
    };
  });

  track('easter_egg', { acao: 'apareceu' });

  // insere numa posição aleatória entre os cards já visíveis
  const cards = grid.querySelectorAll('.card');
  if (cards.length > 2) {
    const pos = 1 + Math.floor(Math.random() * (cards.length - 1));
    grid.insertBefore(egg, cards[pos]);
  } else {
    grid.appendChild(egg);
  }
}

// ── PROFUNDIDADE DE ROLAGEM ────────────────────────
const marcosScroll = { '25': false, '50': false, '75': false, '100': false };
function checarScroll() {
  const h = document.documentElement;
  const total = h.scrollHeight - h.clientHeight;
  if (total <= 0) return;
  const pct = (h.scrollTop / total) * 100;
  [25, 50, 75, 100].forEach(m => {
    if (pct >= m && !marcosScroll[m]) {
      marcosScroll[m] = true;
      track('rolagem', { profundidade: m + '%' });
    }
  });
}
window.addEventListener('scroll', () => {
  clearTimeout(window._scrollT);
  window._scrollT = setTimeout(checarScroll, 200);
});

// ── INIT ───────────────────────────────────────────
window.addEventListener('load', async () => {
  document.body.classList.add('mono'); // inicia em p&b
  updateCounts();                      // contadores salvos
  setLoading(true);

  // carrega o acervo do arquivo externo; se falhar OU vier vazio, usa o embutido
  try {
    const res = await fetch('acervo.json');
    if (!res.ok) throw new Error('sem acervo.json');
    const data = await res.json();
    const lista = (data && Array.isArray(data.esculturas)) ? data.esculturas : [];
    // só usa o externo se ele tiver conteúdo válido
    if (lista.length > 0) {
      ACERVO = lista;
      CATEGORIAS = Array.isArray(data.categorias) ? data.categorias : [];
    } else {
      throw new Error('acervo.json vazio');
    }
  } catch(e) {
    // fallback: acervo embutido no próprio site (sempre funciona)
    ACERVO = ACERVO_EMBUTIDO.esculturas || [];
    CATEGORIAS = ACERVO_EMBUTIDO.categorias || [];
  }

  // garantia final: se por qualquer motivo ficou vazio, usa o embutido
  if (!Array.isArray(ACERVO) || ACERVO.length === 0) {
    ACERVO = ACERVO_EMBUTIDO.esculturas || [];
    CATEGORIAS = ACERVO_EMBUTIDO.categorias || [];
  }

  setLoading(false);
  try {
    montarCategorias();       // monta o menu de categorias
    currentQuery = '';
    currentCategoria = null;
    doSearch(true);           // mostra o acervo completo
  } catch(err) {
    // se algo quebrar, tenta de novo só com o embutido
    console.error('erro ao montar galeria:', err);
    ACERVO = ACERVO_EMBUTIDO.esculturas || [];
    CATEGORIAS = ACERVO_EMBUTIDO.categorias || [];
    montarCategorias();
    doSearch(true);
  }
});
</script>
